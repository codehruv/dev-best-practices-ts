version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge: let a release age before adopting it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps): '
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps): '
    groups:
      # Minor and patch bumps land as one PR. Majors stay separate so each gets its own review.
      minor-and-patch:
        update-types: [minor, patch]
