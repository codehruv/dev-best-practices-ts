version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    # Matches pnpm's minimumReleaseAge: let a release age before adopting it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps): '
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: 'chore(deps): '
    # Dependabot assigns each update to the first group it matches, so the family groups
    # come first. Packages in a family share a major version and break when bumped apart.
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*', '@amiceli/vitest-cucumber']
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*']
      typedoc:
        patterns: ['typedoc', 'typedoc-*']
      cucumber:
        patterns: ['@cucumber/*']
      # Minor and patch bumps land as one PR. Majors stay separate so each gets its own review.
      minor-and-patch:
        update-types: [minor, patch]
